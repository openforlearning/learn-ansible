---
- name: Shell vs Command module
  hosts: localhost
  connection: local
  gather_facts: yes
  become: yes
  tasks:
    - name: Command module example
      command: cat /etc/passwd | grep roboshop
      register: command_output
      ignore_errors: yes

    - name: Print the command output
      debug:
        msg: "Command output: {{ command_output }}"
    
    - name: Shell module example
      shell: cat /etc/passwd | grep roboshop
      register: shell_output

    - name: Print the shell output
      debug:
        msg: "Shell output: {{ shell_output }}"
...