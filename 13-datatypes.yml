    - name: Display datatypes of another example
      debug:
        msg:
          Company: "Netskope"
          Tenurity: 95
          Hours of work per day: 8.5
          Work from Office: false
          Technologies to work on: ["Ansible", "Salt", "Terraform", "PowerDNS", "Kubernetes", "BIND DNS"]
          US Visit details: {"city": "Santa Clara", "Stay": 05, "Office": "HQ"}
          Null: null
